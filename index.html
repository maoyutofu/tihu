  <script>
    // 统一所有 frame 内的背景色（iframe 同源，加载后注入样式覆盖背景）
    // 想换配色只改下面两个值即可
    var SKY_TOP = '#cfe3ff';    // 天空渐变上沿
    var SKY_BOTTOM = '#eef5ff'; // 天空渐变下沿 / 页面底色

    function unifyFrameBg(ifr) {
      try {
        var doc = ifr.contentDocument || (ifr.contentWindow && ifr.contentWindow.document);
        if (!doc || !doc.documentElement) return;
        if (doc.getElementById('__tihu_bg')) return; // 避免重复注入
        var s = doc.createElement('style');
        s.id = '__tihu_bg';
        s.textContent =
          'html,body{background:' + SKY_BOTTOM + ' !important;}' +
          'linearGradient#sky stop:first-child{stop-color:' + SKY_TOP + ' !important;}' +
          'linearGradient#sky stop:last-child{stop-color:' + SKY_BOTTOM + ' !important;}' +
          'svg > rect:first-of-type{fill:' + SKY_BOTTOM + ' !important;}';
        (doc.head || doc.documentElement).appendChild(s);
      } catch (e) {
        /* 非同源 / 脚本被禁用时静默跳过，保留原背景 */
      }
    }

    function initFrames() {
      document.querySelectorAll('iframe.frame').forEach(function (ifr) {
        if (ifr.contentDocument && ifr.contentDocument.readyState === 'complete') unifyFrameBg(ifr);
        ifr.addEventListener('load', function () { unifyFrameBg(ifr); });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initFrames);
    } else {
      initFrames();
    }
    // 兜底：部分环境 load 事件已错过，延迟再试一次
    setTimeout(initFrames, 600);
  </script>
